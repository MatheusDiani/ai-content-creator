[project]
name = "redator-de-conteudo"
version = "0.1.0"
description = "Social media content writer pipeline using LangGraph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "pydantic>=2.0.0",
    "streamlit>=1.40.0",
    "huggingface-hub>=0.26.0",
    "tavily-python>=0.5.0",
    "duckduckgo-search>=6.0.0",
    "arxiv>=2.1.0",
    "pymongo>=4.10.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
